<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Ukrainian Colours</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main>
    <h1>Colours</h1>
    <h2>Learn the colours in Ukrainian!</h2>
    <h2 class="color-title" id="red">
      chervonyy (<span lang="uk">червоний</span>)
    </h2>
    <img src="./assets/images/red.png" alt="red colour swatch" />

    <h2 class="color-title" id="orange">
      pomaranchevyy (<span lang="uk">помаранчевий</span>)
    </h2>
    <img src="./assets/images/orange.png" alt="orange colour swatch" />

    <h2 class="color-title" id="yellow">
      zhovtyy (<span lang="uk">жовтий</span>)
    </h2>
    <img src="./assets/images/yellow.png" alt="yellow colour swatch" />

    <h2 class="color-title" id="green">
      zelenyy (<span lang="uk">зелений</span>)
    </h2>
    <img src="./assets/images/green.png" alt="green colour swatch" />

    <h2 class="color-title" id="blue">
      syniy (<span lang="uk">синій</span>)
    </h2>
    <img src="./assets/images/blue.png" alt="blue colour swatch" />

    <h2 class="color-title" id="purple">
      fioletovyy (<span lang="uk">фіолетовий</span>)
    </h2>
    <img src="./assets/images/purple.png" alt="purple colour swatch" />

    <h2 class="color-title" id="pink">
      rozhevyy (<span lang="uk">рожевий</span>)
    </h2>
    <img src="./assets/images/pink.png" alt="pink colour swatch" />

    <h2 class="color-title" id="brown">
      korychnevyy (<span lang="uk">коричневий</span>)
    </h2>
    <img src="./assets/images/brown.png" alt="brown colour swatch" />

    <h2 class="color-title" id="black">
      chornyy (<span lang="uk">чорний</span>)
    </h2>
    <img src="./assets/images/black.png" alt="black colour swatch" />

    <h2 class="color-title" id="white">
      bilyy (<span lang="uk">білий</span>)
    </h2>
    <img src="./assets/images/white.png" class="white-color" alt="white colour swatch" />

    <h2 class="color-title" id="grey">
      siryy (<span lang="uk">сірий</span>)
    </h2>
    <img src="./assets/images/grey.png" alt="grey colour swatch" />
  </main>
</body>

</html>
