<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ukrainian Numbers 1–10</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main>
    <h1>Numbers 1–10</h1>
    <h2>Learn the Numbers 1–10 in Ukrainian!</h2>
    <h2 class="color-title">
      <span lang="uk-Latn">odyn</span> (<span lang="uk">один</span>)
    </h2>
    <img src="./assets/images/1.png" alt="Number 1 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">dva</span> (<span lang="uk">два</span>)
    </h2>
    <img src="./assets/images/2.png" alt="Number 2 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">try</span> (<span lang="uk">три</span>)
    </h2>
    <img src="./assets/images/3.png" alt="Number 3 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">chotyry</span> (<span lang="uk">чотири</span>)
    </h2>
    <img src="./assets/images/4.png" alt="Number 4 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">pʹiatʹ</span> (<span lang="uk">п’ять</span>)
    </h2>
    <img src="./assets/images/5.png" alt="Number 5 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">shistʹ</span> (<span lang="uk">шість</span>)
    </h2>
    <img src="./assets/images/6.png" alt="Number 6 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">sim</span> (<span lang="uk">сім</span>)
    </h2>
    <img src="./assets/images/7.png" alt="Number 7 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">visim</span> (<span lang="uk">вісім</span>)
    </h2>
    <img src="./assets/images/8.png" alt="Number 8 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">devʹiatʹ</span> (<span lang="uk">дев’ять</span>)
    </h2>
    <img src="./assets/images/9.png" alt="Number 9 in Ukrainian" />

    <h2 class="color-title">
      <span lang="uk-Latn">desiatʹ</span> (<span lang="uk">десять</span>)
    </h2>
    <img src="./assets/images/10.png" alt="Number 10 in Ukrainian" />
  </main>
</body>

</html>
